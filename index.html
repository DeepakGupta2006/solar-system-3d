<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Solar System</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Maps "three" to the local copy in ./lib so no internet is needed -->
  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three.module.js",
      "three/addons/": "./lib/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <p id="loader-text">Generating planets…</p>
  </div>

  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <aside id="panel">
    <h1>Solar System</h1>

    <label class="row">Time speed
      <input id="speed" type="range" min="0" max="10" step="0.1" value="1" />
      <span id="speed-val">1.0×</span>
    </label>

    <div class="toggles">
      <label><input type="checkbox" id="t-orbits" checked /> Orbits</label>
      <label><input type="checkbox" id="t-labels" checked /> Labels</label>
      <label><input type="checkbox" id="t-belt" checked /> Asteroid belt</label>
      <label><input type="checkbox" id="t-rotate" checked /> Auto-orbit camera</label>
    </div>

    <button id="pause">❚❚ Pause</button>

    <h2>Fly to</h2>
    <div id="planet-buttons"></div>
    <button id="reset" class="ghost">⟲ Whole system</button>
  </aside>

  <div id="info" class="hidden"></div>
  <div id="hint">Drag = rotate · Scroll = zoom · Right-drag = pan · Click a planet to follow it</div>

  <script type="module" src="main.js"></script>
</body>
</html>
